<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web MiniTools</title>
    <script>
      // 初回描画の前にテーマを適用する（ちらつき防止）。src/theme/theme.ts と同じ処理。
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('web-minitools-theme') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CsaOuYgW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CFa5V6mt.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
